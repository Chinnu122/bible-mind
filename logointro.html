<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Mind - Logo Intro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #1a3c5a;
            --gold: #d4af37;
            --gold-bright: #fff9ed;
            --void: #000000;
            --nebula-1: rgba(26, 60, 90, 0.5);
            --nebula-2: rgba(76, 29, 149, 0.35);
            --nebula-3: rgba(212, 175, 55, 0.2);
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-epic: cubic-bezier(0.7, 0, 0.1, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            font-family: 'Lato', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .intro-container {
            position: fixed;
            inset: 0;
            perspective: 2000px;
        }

        /* Animated Background */
        .nebula-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #000 0%, #0a1628 50%, #000 100%);
            overflow: hidden;
        }

        .nebula-cloud {
            position: absolute;
            width: 150%;
            height: 150%;
            border-radius: 50%;
            filter: blur(100px);
            mix-blend-mode: screen;
            will-change: transform;
        }

        .cloud-1 {
            background: radial-gradient(circle, var(--nebula-1) 0%, transparent 70%);
            top: -30%;
            left: -30%;
            animation: nebulaFloat 25s infinite alternate ease-in-out;
        }

        .cloud-2 {
            background: radial-gradient(circle, var(--nebula-2) 0%, transparent 70%);
            bottom: -30%;
            right: -30%;
            animation: nebulaFloat 30s infinite alternate-reverse ease-in-out;
        }

        .cloud-3 {
            background: radial-gradient(circle, var(--nebula-3) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            animation: nebulaPulse 20s infinite ease-in-out;
        }

        @keyframes nebulaFloat {
            0% {
                transform: translate(-15%, -15%) rotate(0deg) scale(1);
            }

            50% {
                transform: translate(10%, 10%) rotate(15deg) scale(1.15);
            }

            100% {
                transform: translate(15%, 15%) rotate(-10deg) scale(1);
            }
        }

        @keyframes nebulaPulse {

            0%,
            100% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, white, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255, 255, 255, 0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, white, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(1px 1px at 370px 200px, white, transparent),
                radial-gradient(2px 2px at 420px 60px, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(1px 1px at 500px 180px, white, transparent),
                radial-gradient(2px 2px at 550px 100px, rgba(255, 255, 255, 0.9), transparent);
            background-size: 600px 300px;
            animation: starsShift 100s linear infinite;
        }

        @keyframes starsShift {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 600px 300px;
            }
        }

        /* Main Stage */
        .intro-stage {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            will-change: transform;
            animation: stageZoom 1.5s 4s var(--transition-epic) forwards;
        }

        @keyframes stageZoom {
            0% {
                transform: scale(1) translateZ(0);
                filter: blur(0);
            }

            30% {
                transform: scale(0.95) translateZ(-50px);
            }

            100% {
                transform: scale(80) translateZ(2000px);
                opacity: 0;
                filter: blur(40px) brightness(3);
            }
        }

        /* Logo Container */
        .logo-container {
            position: relative;
            width: 360px;
            height: 360px;
            transform-style: preserve-3d;
            animation: logoFloat 6s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* Outer Glow Ring */
        .glow-ring {
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(90deg, var(--gold), var(--navy), var(--gold)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            animation: ringReveal 1.5s 0.5s var(--transition-smooth) forwards, ringRotate 8s linear infinite;
        }

        @keyframes ringReveal {
            to {
                opacity: 1;
            }
        }

        @keyframes ringRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Secondary Glow Ring */
        .glow-ring-2 {
            position: absolute;
            inset: -50px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            opacity: 0;
            animation: ringReveal 1.5s 0.8s var(--transition-smooth) forwards, ringRotate 15s linear reverse infinite;
        }

        /* Badge */
        .badge {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f0f0f0 30%, #d0d0d0 100%);
            border-radius: 50%;
            border: 16px solid var(--navy);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 60px 120px rgba(0, 0, 0, 0.9),
                0 0 80px rgba(212, 175, 55, 0.3),
                inset 0 0 60px rgba(0, 0, 0, 0.1),
                inset 0 -20px 60px rgba(26, 60, 90, 0.1);
            opacity: 0;
            transform: scale(0.1) rotateX(-90deg);
            animation: badgeRise 1.2s var(--transition-smooth) forwards;
        }

        @keyframes badgeRise {
            to {
                opacity: 1;
                transform: scale(1) rotateX(0deg);
            }
        }

        /* Shine Effect on Badge */
        .badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.8) 50%, transparent 60%);
            border-radius: 50%;
            background-size: 400% 400%;
            animation: badgeShine 6s infinite linear;
        }

        @keyframes badgeShine {
            0% {
                background-position: -200% -200%;
            }

            100% {
                background-position: 200% 200%;
            }
        }

        /* Logo SVG */
        .logo-svg {
            width: 200px;
            height: 200px;
            z-index: 5;
        }

        .svg-path {
            fill: none;
            stroke: var(--navy);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 1.5s 0.8s var(--transition-smooth) forwards;
        }

        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }

        .cross-rect {
            fill: var(--gold);
            opacity: 0;
            transform-origin: center;
            animation: crossAppear 0.8s 2s var(--transition-epic) forwards;
        }

        @keyframes crossAppear {
            0% {
                opacity: 0;
                transform: scale(5);
                filter: blur(20px);
            }

            60% {
                opacity: 1;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* Book at bottom */
        .book-svg {
            position: absolute;
            bottom: 50px;
            width: 160px;
            opacity: 0;
            transform: translateY(30px) rotateX(-90deg);
            animation: bookReveal 0.8s 1.2s var(--transition-smooth) forwards;
        }

        @keyframes bookReveal {
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }

        /* Light Burst */
        .light-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 150px 60px rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            animation: lightBurst 0.8s 2s var(--transition-epic);
        }

        @keyframes lightBurst {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(100);
                opacity: 0;
            }
        }

        /* Title */
        .title-container {
            margin-top: 40px;
            text-align: center;
        }

        .title-text {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .char {
            font-family: 'Cinzel', serif;
            font-size: clamp(48px, 8vw, 72px);
            font-weight: 900;
            color: #fff;
            text-shadow:
                0 0 40px rgba(212, 175, 55, 0.5),
                0 0 80px rgba(212, 175, 55, 0.3);
            opacity: 0;
            transform: translateY(40px);
            filter: blur(15px);
            display: inline-block;
        }

        .char.animate {
            animation: charEnter 0.6s var(--transition-smooth) forwards;
        }

        @keyframes charEnter {
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 16px;
            color: var(--gold);
            text-transform: uppercase;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: subtitleEnter 1s 3.5s var(--transition-smooth) forwards;
        }

        @keyframes subtitleEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Skip Button */
        .skip-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }

        /* Particle Effects */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold);
            opacity: 0;
        }

        @keyframes particleRise {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .logo-container {
                width: 280px;
                height: 280px;
            }

            .logo-svg {
                width: 160px;
                height: 160px;
            }

            .book-svg {
                width: 120px;
                bottom: 40px;
            }

            .badge {
                border-width: 12px;
            }

            .glow-ring {
                inset: -20px;
            }

            .glow-ring-2 {
                inset: -35px;
            }

            .title-text {
                gap: 6px;
            }

            .subtitle {
                letter-spacing: 8px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="intro-container">
        <!-- Nebula Background -->
        <div class="nebula-bg">
            <div class="stars"></div>
            <div class="nebula-cloud cloud-1"></div>
            <div class="nebula-cloud cloud-2"></div>
            <div class="nebula-cloud cloud-3"></div>
        </div>

        <!-- Particles -->
        <div class="particles" id="particles"></div>

        <!-- Light Burst -->
        <div class="light-burst"></div>

        <!-- Main Stage -->
        <div class="intro-stage">
            <!-- Logo -->
            <div class="logo-container">
                <div class="glow-ring"></div>
                <div class="glow-ring-2"></div>

                <div class="badge">
                    <!-- Logo SVG -->
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <!-- Book curves -->
                        <path class="svg-path" d="M35,28 Q18,28 18,50 Q18,72 35,72" />
                        <path class="svg-path" d="M65,28 Q82,28 82,50 Q82,72 65,72" />
                        <path class="svg-path" style="animation-delay: 2s" d="M30,42 Q24,42 24,56" />
                        <path class="svg-path" style="animation-delay: 2.2s" d="M70,42 Q76,42 76,56" />

                        <!-- Cross -->
                        <g>
                            <rect class="cross-rect" x="45" y="20" width="10" height="48" rx="2" />
                            <rect class="cross-rect" style="animation-delay: 2.1s" x="34" y="33" width="32" height="10"
                                rx="2" />
                        </g>
                    </svg>

                    <!-- Book at bottom -->
                    <svg class="book-svg" viewBox="0 0 100 40">
                        <path fill="#d4af37" d="M50,35 L8,28 L8,10 L50,18 Z" />
                        <path fill="#b8972f" d="M50,35 L92,28 L92,10 L50,18 Z" />
                        <path fill="#f5e6a8" d="M50,35 L50,18 L50,18 L50,35 Z" stroke="#d4af37" stroke-width="0.5" />
                    </svg>
                </div>
            </div>

            <!-- Title -->
            <div class="title-container">
                <div class="title-text" id="titleText"></div>
                <p class="subtitle">Wisdom & Understanding</p>
            </div>
        </div>

        <!-- Skip Button -->
        <button class="skip-btn" onclick="skipIntro()">Skip Intro</button>
    </div>

    <script>
        // Animate title characters
        document.addEventListener('DOMContentLoaded', () => {
            const title = "BIBLE MIND";
            const container = document.getElementById('titleText');

            title.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'char';
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                container.appendChild(span);

                // Stagger animation
                setTimeout(() => {
                    span.classList.add('animate');
                }, 2500 + (i * 80));
            });

            // Create particles
            createParticles();

            // Auto-skip after animation
            setTimeout(() => {
                console.log('Intro complete - would navigate to main app');
            }, 5500);
        });

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particle.style.animationDelay = (Math.random() * 3) + 's';
                particle.style.animation = `particleRise ${particle.style.animationDuration} ${particle.style.animationDelay} infinite linear`;
                particle.style.width = (Math.random() * 4 + 2) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // Mouse parallax
        document.addEventListener('mousemove', (e) => {
            const stage = document.querySelector('.intro-stage');
            if (!stage) return;

            const rotY = (window.innerWidth / 2 - e.pageX) / 80;
            const rotX = (window.innerHeight / 2 - e.pageY) / 80;
            stage.style.transform = `rotateY(${-rotY}deg) rotateX(${rotX}deg)`;
        });

        function skipIntro() {
            const container = document.querySelector('.intro-container');
            container.style.transition = 'opacity 0.5s ease';
            container.style.opacity = '0';
            setTimeout(() => {
                console.log('Skip - would navigate to main app');
            }, 500);
        }
    </script>
</body>

</html>
