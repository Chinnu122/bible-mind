<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Mind - Nebula Genesis</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:wght@300;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #1a3c5a;
            --gold: #bfa37c;
            --gold-bright: #fff9ed;
            --void: #000000;
            /* Enhanced Nebula Colors */
            --nebula-1: rgba(26, 60, 90, 0.4);
            --nebula-2: rgba(76, 29, 149, 0.25);
            --nebula-3: rgba(191, 163, 124, 0.15);
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-epic: cubic-bezier(0.7, 0, 0.1, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--void);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Lato', sans-serif;
            perspective: 2000px;
        }

        /* --- Vivid Live Nebula Background --- */
        .nebula-container {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            background: black;
        }

        /* Noise texture for a cinematic space feel */
        .nebula-container::after {
            content: "";
            position: absolute;
            inset: -100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.08;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .nebula-cloud {
            position: absolute;
            width: 140%;
            height: 140%;
            border-radius: 50%;
            filter: blur(80px);
            mix-blend-mode: screen;
            will-change: transform, opacity;
        }

        .cloud-1 {
            background: radial-gradient(circle, var(--nebula-1) 0%, transparent 70%);
            top: -20%;
            left: -20%;
            animation: nebulaMove 30s infinite alternate linear;
        }

        .cloud-2 {
            background: radial-gradient(circle, var(--nebula-2) 0%, transparent 70%);
            bottom: -20%;
            right: -20%;
            animation: nebulaMove 25s infinite alternate-reverse linear;
        }

        .cloud-3 {
            background: radial-gradient(circle, var(--nebula-3) 0%, transparent 60%);
            top: 30%;
            left: 30%;
            width: 100%;
            height: 100%;
            animation: nebulaMove 40s infinite alternate ease-in-out;
            opacity: 0.5;
        }

        @keyframes nebulaMove {
            0% {
                transform: translate(-10%, -10%) rotate(0deg) scale(1);
            }

            50% {
                transform: translate(5%, 5%) rotate(10deg) scale(1.1);
            }

            100% {
                transform: translate(10%, 10%) rotate(-10deg) scale(1);
            }
        }

        /* --- The Main Stage --- */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            animation: finalWarp 2.5s 7.5s var(--transition-epic) forwards;
        }

        @keyframes finalWarp {
            0% {
                transform: scale(1) translateZ(0);
                filter: blur(0);
            }

            30% {
                transform: scale(0.9) translateZ(-100px);
            }

            100% {
                transform: scale(100) translateZ(3000px);
                opacity: 0;
                filter: blur(30px) brightness(5);
            }
        }

        /* --- Crystalline Logo Assembly --- */
        .artifact-wrap {
            position: relative;
            width: 320px;
            height: 320px;
            transform-style: preserve-3d;
        }

        .badge-main {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e5e5e5 100%);
            border-radius: 50%;
            border: 14px solid var(--navy);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 60px 100px rgba(0, 0, 0, 0.8),
                inset 0 0 40px rgba(0, 0, 0, 0.1);

            opacity: 0;
            transform: scale(0.2) rotateX(-60deg);
            animation: badgeRise 1.8s var(--transition-smooth) forwards;
            will-change: transform, opacity;
        }

        @keyframes badgeRise {
            to {
                opacity: 1;
                transform: scale(1) rotateX(0deg);
            }
        }

        /* Surface Glint */
        .badge-main::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 45%, rgba(255, 255, 255, 0.7) 50%, transparent 55%);
            border-radius: 50%;
            background-size: 400% 400%;
            animation: surfaceSweep 8s infinite linear;
        }

        @keyframes surfaceSweep {
            0% {
                background-position: -200% -200%;
            }

            100% {
                background-position: 200% 200%;
            }
        }

        /* --- Logo Elements (SVG) --- */
        .logo-svg {
            width: 200px;
            height: 200px;
            z-index: 5;
        }

        .svg-part {
            fill: none;
            stroke: var(--navy);
            stroke-width: 3.5;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawSvg 2.5s 1.2s var(--transition-smooth) forwards;
        }

        .svg-cross {
            fill: var(--gold);
            opacity: 0;
            transform: scale(4) translateZ(400px);
            animation: crossLand 1.2s 3.5s var(--transition-epic) forwards;
        }

        @keyframes drawSvg {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes crossLand {
            0% {
                opacity: 0;
                transform: scale(4) translateZ(400px);
                filter: blur(20px);
            }

            70% {
                opacity: 1;
                transform: scale(0.9) translateZ(0);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateZ(0);
                filter: blur(0);
            }
        }

        .book-reveal {
            position: absolute;
            bottom: 55px;
            width: 170px;
            opacity: 0;
            transform: translateY(30px) rotateX(-90deg);
            animation: bookOpen 1.5s 2.2s var(--transition-smooth) forwards;
        }

        @keyframes bookOpen {
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }

        /* --- Typography --- */
        .text-wrap {
            margin-top: 60px;
            text-align: center;
        }

        .title-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .char {
            font-family: 'Cinzel', serif;
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            opacity: 0;
            transform: translateY(30px);
            filter: blur(10px);
            animation: charEnter 0.8s var(--transition-smooth) forwards;
            will-change: transform, opacity, filter;
        }

        @keyframes charEnter {
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .tagline {
            font-size: 14px;
            letter-spacing: 16px;
            color: var(--gold);
            text-transform: uppercase;
            margin-top: 15px;
            opacity: 0;
            animation: fadeIn 2s 5.5s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Shockwave Light */
        .light-hit {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 100px 40px white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            animation: hitTrigger 1s 3.5s var(--transition-epic);
        }

        @keyframes hitTrigger {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(50);
                opacity: 0;
            }
        }

        /* --- Controls --- */
        .controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 100;
        }

        .btn-smooth {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 3px;
            transition: 0.3s;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        .btn-smooth:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>

    <div class="nebula-container">
        <div class="nebula-cloud cloud-1"></div>
        <div class="nebula-cloud cloud-2"></div>
        <div class="nebula-cloud cloud-3"></div>
    </div>

    <div class="light-hit"></div>

    <div class="stage" id="mainStage">
        <div class="artifact-wrap">
            <div class="badge-main">
                <svg class="logo-svg" viewBox="0 0 100 100">
                    <path class="svg-part" d="M35,30 Q20,30 20,50 Q20,70 35,70" />
                    <path class="svg-part" d="M65,30 Q80,30 80,50 Q80,70 65,70" />
                    <path class="svg-part" style="animation-delay: 1.8s" d="M32,45 Q26,45 26,55" />
                    <path class="svg-part" style="animation-delay: 2.0s" d="M68,45 Q74,45 74,55" />

                    <g class="svg-cross">
                        <rect x="46" y="22" width="8" height="44" rx="1.5" />
                        <rect x="36" y="34" width="28" height="8" rx="1.5" />
                    </g>
                </svg>

                <svg class="book-reveal" viewBox="0 0 100 40">
                    <path fill="var(--gold)" d="M50,35 L10,30 L10,12 L50,18 Z" />
                    <path fill="var(--gold)" d="M50,35 L90,30 L90,12 L50,18 Z" opacity="0.8" />
                </svg>
            </div>
        </div>

        <div class="text-wrap">
            <div class="title-container" id="titleGroup"></div>
            <p class="tagline">Wisdom & Understanding</p>
        </div>
    </div>

    <div class="controls">
        <button class="btn-smooth" onclick="location.reload()">Replay Experience</button>
    </div>

    <script>
        const titleGroup = document.getElementById('titleGroup');
        const text = "BIBLE MIND";

        text.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.className = 'char';
            span.style.animationDelay = `${4.5 + (i * 0.1)}s`;
            span.innerHTML = char === ' ' ? '&nbsp;' : char;
            titleGroup.appendChild(span);
        });

        const stage = document.getElementById('mainStage');
        let request = null;

        window.addEventListener('mousemove', (e) => {
            if (request) cancelAnimationFrame(request);

            request = requestAnimationFrame(() => {
                const rotY = (window.innerWidth / 2 - e.pageX) / 60;
                const rotX = (window.innerHeight / 2 - e.pageY) / 60;
                stage.style.transform = `rotateY(${-rotY}deg) rotateX(${rotX}deg)`;
            });
        });
    </script>
</body>

</html>
