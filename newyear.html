<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Happy New Year 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --black: #07070a;
            --midnight: #0b1626;
            --gold: #d4af37;
            --champagne: #f3e6c8;
            --white: #f7f7fb;
        }

        html,
        body {
            height: 100%;
            background: var(--black);
            margin: 0;
        }

        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            height: 100vh;
            width: 100vw;
            background: radial-gradient(1200px 800px at 50% 55%, rgba(212, 175, 55, .08), transparent 60%),
                linear-gradient(180deg, var(--black), var(--midnight) 55%, var(--black));
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Cinematic overlays */
        .grade {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(900px 700px at 50% 40%, rgba(255, 255, 255, .06), transparent 55%),
                radial-gradient(1200px 900px at 50% 65%, rgba(212, 175, 55, .10), transparent 60%),
                linear-gradient(180deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .2) 35%, rgba(0, 0, 0, .75));
            mix-blend-mode: normal;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, .75) 100%);
            opacity: .9;
        }

        .grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .045;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            animation: grain 500ms steps(10) infinite;
        }

        @keyframes grain {
            0% {
                transform: translate(0, 0)
            }

            10% {
                transform: translate(-3%, 2%)
            }

            20% {
                transform: translate(2%, -3%)
            }

            30% {
                transform: translate(4%, 1%)
            }

            40% {
                transform: translate(-2%, 4%)
            }

            50% {
                transform: translate(-4%, -2%)
            }

            60% {
                transform: translate(2%, 3%)
            }

            70% {
                transform: translate(3%, -1%)
            }

            80% {
                transform: translate(-2%, -3%)
            }

            90% {
                transform: translate(1%, 2%)
            }

            100% {
                transform: translate(0, 0)
            }
        }

        /* Text layout */
        .content {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            text-align: center;
            padding: clamp(18px, 5vw, 60px);
            z-index: 10;
        }

        .stack {
            width: min(1100px, 92vw);
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        .kicker {
            font-weight: 300;
            letter-spacing: .55em;
            text-transform: uppercase;
            font-size: clamp(10px, 1.8vw, 14px);
            color: rgba(243, 230, 200, .85);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        h1 {
            margin: 14px 0 10px;
            font-family: "Cormorant Garamond", serif;
            font-weight: 500;
            line-height: .95;
            font-size: clamp(40px, 7.5vw, 96px);
            color: var(--white);
            opacity: 0;
            transform: translateY(14px) scale(.99);
            transition: opacity 1.4s ease, transform 1.4s ease;
            text-shadow: 0 18px 60px rgba(0, 0, 0, .55);
        }

        .gold {
            background: linear-gradient(135deg, var(--gold) 0%, var(--champagne) 45%, var(--gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 22px rgba(212, 175, 55, .20));
        }

        .sub {
            margin: 0 auto 18px;
            font-weight: 300;
            color: rgba(247, 247, 251, .78);
            font-size: clamp(14px, 2.2vw, 18px);
            line-height: 1.8;
            max-width: 62ch;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        /* Glass verse card */
        .verseCard {
            margin: 22px auto 0;
            padding: clamp(14px, 3vw, 22px) clamp(14px, 3vw, 28px);
            border-radius: 22px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(212, 175, 55, .22);
            backdrop-filter: blur(16px);
            box-shadow:
                0 22px 60px rgba(0, 0, 0, .35),
                inset 0 1px 0 rgba(255, 255, 255, .08);
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            max-width: 76ch;
        }

        .typed {
            font-family: "Cormorant Garamond", serif;
            font-weight: 400;
            font-size: clamp(18px, 2.8vw, 26px);
            line-height: 1.55;
            color: rgba(247, 247, 251, .92);
            letter-spacing: .01em;
            min-height: 5.2em;
            /* keeps layout stable while typing */
        }

        .caret {
            display: inline-block;
            width: 10px;
            height: 1.05em;
            margin-left: 2px;
            transform: translateY(3px);
            background: linear-gradient(180deg, rgba(212, 175, 55, .95), rgba(243, 230, 200, .75));
            box-shadow: 0 0 18px rgba(212, 175, 55, .28);
            animation: blink 850ms steps(1) infinite;
            vertical-align: baseline;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .ref {
            margin-top: 10px;
            font-size: 13px;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: rgba(243, 230, 200, .78);
            font-weight: 300;
            opacity: .0;
            transition: opacity 1s ease;
        }

        /* Visible states driven by JS timeline */
        .show .kicker,
        .show h1,
        .show .sub {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .showVerse .verseCard {
            opacity: 1;
            transform: translateY(0);
        }

        .showRef .ref {
            opacity: .95;
        }

        /* Fade out end */
        .fadeOut {
            opacity: 0;
            transition: opacity 1.3s ease;
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .grain {
                animation: none;
            }

            .caret {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <section class="hero" id="hero">
        <canvas id="bg"></canvas>
        <canvas id="fx"></canvas>

        <div class="grade"></div>
        <div class="vignette"></div>
        <div class="grain"></div>

        <div class="content">
            <div class="stack" id="stack">
                <div class="kicker" id="kicker">For friends • family • kids</div>

                <h1 id="title">
                    Happy New Year<br>
                    <span class="gold">2026</span>
                </h1>

                <p class="sub" id="sub">
                    May your home be filled with peace, laughter, and love—together, all year long.
                </p>

                <div class="verseCard" id="verseCard" aria-label="Bible verse">
                    <div class="typed" id="typed"></div>
                    <div class="ref" id="ref">Numbers 6:24–26</div>
                </div>
            </div>
        </div>
    </section>

    <script>
        /**
         * Luxury New Year 2026 cinematic hero
         * - Procedural visuals (unique per load seed)
         * - Continuous slow zoom in/out + micro-shake (camera)
         * - Typed Bible verse after greeting
         *
         * Verse text: Holy Bible, Numbers 6:24–26 (wording varies by translation).
         */

        // ====== Timeline (seconds) ======
        const DURATION_S = 26.0;            // total loop length (20–30s)
        const SHOW_GREETING_AT = 0.6;       // show main greeting
        const SHOW_VERSE_AT = 6.0;          // show verse card + start typing
        const SHOW_REF_AT = 15.0;           // show reference after typing settles
        const FIREWORKS_AT = 17.0;          // celebratory lift
        const FADE_OUT_AT = 24.2;           // fade to black
        const RESTART_AT = 26.0;            // restart loop

        // ====== Text (edit freely) ======
        const VERSE_TEXT =
            `The LORD bless you and keep you;
the LORD make his face to shine upon you
and be gracious to you;
the LORD lift up his countenance upon you
and give you peace.`;

        // ====== DOM ======
        const hero = document.getElementById('hero');
        const stack = document.getElementById('stack');
        const verseCard = document.getElementById('verseCard');
        const typedEl = document.getElementById('typed');
        const refEl = document.getElementById('ref');

        // ====== Utilities ======
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        // Seeded RNG (Mulberry32)
        function mulberry32(seed) {
            return function () {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
        }
        const seed = (crypto?.getRandomValues ? crypto.getRandomValues(new Uint32Array(1))[0] : (Date.now() >>> 0));
        const rand = mulberry32(seed);

        // ====== Canvas setup ======
        const bg = document.getElementById('bg');
        const fx = document.getElementById('fx');
        const bgCtx = bg.getContext('2d', { alpha: true });
        const fxCtx = fx.getContext('2d', { alpha: true });

        function resize() {
            const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
            for (const c of [bg, fx]) {
                c.width = Math.floor(window.innerWidth * dpr);
                c.height = Math.floor(window.innerHeight * dpr);
                c.style.width = window.innerWidth + "px";
                c.style.height = window.innerHeight + "px";
            }
            bgCtx.setTransform(1, 0, 0, 1, 0, 0);
            fxCtx.setTransform(1, 0, 0, 1, 0, 0);
            bgCtx.scale(dpr, dpr);
            fxCtx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize, { passive: true });
        resize();

        // ====== Scene elements ======
        const particles = [];
        const PARTICLE_COUNT = 120;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: rand() * window.innerWidth,
                y: rand() * window.innerHeight,
                r: 0.8 + rand() * 2.8,
                vy: 0.06 + rand() * 0.28,
                vx: (-0.08 + rand() * 0.16),
                a: 0.10 + rand() * 0.45,
                z: 0.25 + rand() * 0.85,      // depth (parallax)
                warm: rand() > 0.32
            });
        }

        // Firework sparks
        const sparks = [];
        function spawnFirework() {
            const cx = window.innerWidth * (0.15 + rand() * 0.70);
            const cy = window.innerHeight * (0.18 + rand() * 0.42);
            const hueWarm = rand() > 0.25;

            const count = 42 + Math.floor(rand() * 28);
            for (let i = 0; i < count; i++) {
                const ang = (Math.PI * 2) * (i / count) + (rand() * 0.25);
                const spd = 1.1 + rand() * 2.6;
                sparks.push({
                    x: cx, y: cy,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    life: 1.0,
                    decay: 0.012 + rand() * 0.02,
                    r: 1.0 + rand() * 1.8,
                    warm: hueWarm,
                });
            }
        }

        // ====== Typed effect ======
        let typing = null;

        function setTyped(text) {
            // reset
            typedEl.textContent = "";
            // caret element appended after spans
            const caret = document.createElement('span');
            caret.className = "caret";
            typedEl.appendChild(caret);

            // We type into a text node placed before caret.
            const node = document.createTextNode("");
            typedEl.insertBefore(node, caret);

            // Type progressively
            const full = text.replace(/\r\n/g, "\n");
            let i = 0;

            const speedBase = 22; // ms per char (will vary)
            const typeTick = () => {
                if (!typing) return;

                if (i >= full.length) {
                    // finished
                    return;
                }
                const ch = full[i++];
                node.textContent += ch;

                // Slightly human timing: pauses on punctuation/newlines
                let delay = speedBase + Math.floor(rand() * 18);
                if (ch === "\n") delay += 180 + Math.floor(rand() * 120);
                if (",;:".includes(ch)) delay += 90 + Math.floor(rand() * 80);
                if (".!?".includes(ch)) delay += 160 + Math.floor(rand() * 140);

                typing.timer = window.setTimeout(typeTick, delay);
            };

            typing = { timer: 0 };
            typeTick();
        }

        function stopTyping() {
            if (!typing) return;
            clearTimeout(typing.timer);
            typing = null;
        }

        // ====== Camera motion (continuous zoom + parallax + micro shake) ======
        function camera(t) {
            // t in seconds
            const zoom = 1.0 + 0.045 * Math.sin(t * 0.55) + 0.018 * Math.sin(t * 1.25 + 1.4);
            const driftX = 10 * Math.sin(t * 0.22 + 0.8);
            const driftY = 7 * Math.cos(t * 0.18 + 0.2);

            // tiny handheld shake (very subtle)
            const shake = 0.55;
            const sx = shake * (Math.sin(t * 9.7) * 0.6 + Math.sin(t * 13.1) * 0.4);
            const sy = shake * (Math.cos(t * 8.9) * 0.6 + Math.cos(t * 12.3) * 0.4);

            return { zoom, x: driftX + sx, y: driftY + sy };
        }

        // ====== Background draw ======
        function drawBackground(timeS) {
            const w = window.innerWidth, h = window.innerHeight;
            bgCtx.clearRect(0, 0, w, h);

            // Soft moving light source
            const lx = w * (0.50 + 0.12 * Math.sin(timeS * 0.18 + 0.6));
            const ly = h * (0.42 + 0.10 * Math.cos(timeS * 0.16 + 1.1));

            // Base gradient
            const g = bgCtx.createRadialGradient(lx, ly, 0, w * 0.5, h * 0.55, Math.max(w, h) * 0.9);
            g.addColorStop(0.00, "rgba(212,175,55,0.14)");
            g.addColorStop(0.25, "rgba(18,22,34,0.55)");
            g.addColorStop(0.60, "rgba(7,7,10,0.96)");
            g.addColorStop(1.00, "rgba(0,0,0,1)");
            bgCtx.fillStyle = g;
            bgCtx.fillRect(0, 0, w, h);

            // Golden ribbon waves (procedural, additive)
            bgCtx.save();
            bgCtx.globalCompositeOperation = "screen";
            bgCtx.globalAlpha = 0.35;
            for (let i = 0; i < 3; i++) {
                const y0 = h * (0.35 + i * 0.16) + 18 * Math.sin(timeS * 0.6 + i * 2.2);
                bgCtx.beginPath();
                bgCtx.moveTo(-40, y0);
                const amp = 34 + i * 10;
                for (let x = 0; x <= w + 60; x += 40) {
                    const y = y0 + amp * Math.sin((x / w) * Math.PI * 2 + timeS * 0.75 + i * 1.4);
                    bgCtx.quadraticCurveTo(x + 20, y, x + 40, y0);
                }
                const stroke = bgCtx.createLinearGradient(0, y0 - 60, 0, y0 + 60);
                stroke.addColorStop(0, "rgba(212,175,55,0)");
                stroke.addColorStop(0.5, "rgba(243,230,200,0.65)");
                stroke.addColorStop(1, "rgba(212,175,55,0)");
                bgCtx.strokeStyle = stroke;
                bgCtx.lineWidth = 2.2 + i * 0.9;
                bgCtx.shadowBlur = 26;
                bgCtx.shadowColor = "rgba(212,175,55,0.25)";
                bgCtx.stroke();
            }
            bgCtx.restore();
        }

        function drawParticles(timeS, cam) {
            const w = window.innerWidth, h = window.innerHeight;
            fxCtx.save();
            fxCtx.clearRect(0, 0, w, h);

            // Bokeh particles with depth/parallax
            for (const p of particles) {
                p.y -= p.vy * (0.8 + p.z);
                p.x += p.vx * (0.8 + p.z);

                if (p.y < -30) { p.y = h + 30; p.x = rand() * w; }
                if (p.x < -40) p.x = w + 40;
                if (p.x > w + 40) p.x = -40;

                const px = p.x + cam.x * (0.22 + 0.35 * p.z);
                const py = p.y + cam.y * (0.22 + 0.35 * p.z);

                const r = p.r * (0.9 + 0.9 * p.z);
                fxCtx.beginPath();
                fxCtx.arc(px, py, r, 0, Math.PI * 2);

                const alpha = p.a * (0.55 + 0.45 * Math.sin(timeS * 0.6 + p.x * 0.01));
                const col = p.warm ? `rgba(212,175,55,${clamp(alpha, 0, 0.7)})` : `rgba(247,247,251,${clamp(alpha * 0.8, 0, 0.55)})`;
                fxCtx.fillStyle = col;

                fxCtx.shadowBlur = 18 + 22 * p.z;
                fxCtx.shadowColor = p.warm ? "rgba(212,175,55,0.35)" : "rgba(255,255,255,0.18)";
                fxCtx.fill();
            }

            fxCtx.restore();
        }

        function drawFireworks(timeS) {
            const w = window.innerWidth, h = window.innerHeight;

            // Update sparks
            fxCtx.save();
            fxCtx.globalCompositeOperation = "screen";

            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vy += 0.018; // gravity
                s.life -= s.decay;

                if (s.life <= 0) {
                    sparks.splice(i, 1);
                    continue;
                }

                const a = clamp(s.life, 0, 1) * 0.9;
                fxCtx.beginPath();
                fxCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                fxCtx.fillStyle = s.warm
                    ? `rgba(212,175,55,${a})`
                    : `rgba(243,230,200,${a})`;
                fxCtx.shadowBlur = 22;
                fxCtx.shadowColor = s.warm ? "rgba(212,175,55,0.35)" : "rgba(255,255,255,0.18)";
                fxCtx.fill();
            }

            fxCtx.restore();
        }

        // ====== Loop / timeline ======
        let start = performance.now();
        let lastFireworkAt = -999;

        function resetLoop() {
            start = performance.now();
            lastFireworkAt = -999;

            hero.classList.remove("fadeOut");
            stack.classList.remove("show", "showVerse", "showRef");

            stopTyping();
            typedEl.textContent = "";
            refEl.style.opacity = "0";

            // small visual variation each loop
            // (not re-seeding; keeps identity but shifts timing)
        }

        function tick(now) {
            const t = (now - start) / 1000;

            // camera motion applied to text (subtle “lens breathing” feel)
            const cam = camera(t);
            stack.style.transform = `translate(${cam.x * 0.10}px, ${cam.y * 0.10}px) scale(${1 + (cam.zoom - 1) * 0.45})`;

            // draw layers
            drawBackground(t);
            drawParticles(t, cam);

            // timeline states
            if (t >= SHOW_GREETING_AT) {
                stack.classList.add("show");
            }

            if (t >= SHOW_VERSE_AT) {
                stack.classList.add("showVerse");
                if (!typing && typedEl.textContent.trim().length === 0) {
                    setTyped(VERSE_TEXT);
                }
            }

            if (t >= SHOW_REF_AT) {
                stack.classList.add("showRef");
            }

            if (t >= FIREWORKS_AT) {
                // occasional fireworks bursts
                if (t - lastFireworkAt > (1.2 + rand() * 1.2)) {
                    spawnFirework();
                    lastFireworkAt = t;
                }
                drawFireworks(t);
            }

            if (t >= FADE_OUT_AT) {
                hero.classList.add("fadeOut");
            }

            if (t >= RESTART_AT) {
                resetLoop();
            }

            requestAnimationFrame(tick);
        }

        resetLoop();
        requestAnimationFrame(tick);
    </script>
</body>

</html>
